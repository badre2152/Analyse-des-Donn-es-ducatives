name: CSV quality checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  data-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source CSVs
        run: python -m unittest discover -s tests -v
